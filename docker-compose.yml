# Local PostgreSQL for development:  docker compose up -d
# Credentials here are for local use only. Never reuse them anywhere real.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxway
      POSTGRES_PASSWORD: oxway_dev_pw
      POSTGRES_DB: oxway_dev
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - oxway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxway -d oxway_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oxway_pgdata:
